
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CareerConnect</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="navbar">
        <a class="logo" href="index.html">CareerConnect<span>.</span></a>

        <nav>
            <a href="index.html">Home</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <main class="auth-section">
        <div class="auth-card">

            <p class="eyebrow">WELCOME BACK</p>

            <h1>Login to your account</h1>

            <p class="auth-description">
                Sign in to continue exploring jobs and internships.
            </p>

            <form id="loginForm">

                <label for="email">Email address</label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

                <label for="password">Password</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit" class="auth-button">
                    Login
                </button>

                <p id="loginMessage" role="status" aria-live="polite"></p>

            </form>

            <p class="auth-footer">
                Don't have an account?
                <a href="register.html">Create one</a>
            </p>

        </div>
    </main>

    <script src="js/auth.js"></script>

</body>
</html>
